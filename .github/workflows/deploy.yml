name: Deploy laryon-api

on:
  push: { branches: [main] }
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/laryon-api

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - run: |
          cd /opt/infra/services/laryon-api
          docker compose pull
          docker compose up -d
          docker image prune -f
