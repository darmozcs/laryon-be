spring:
  application:
    name: laryon-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexora}
    username: ${DB_USER:nexora}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: lay_flyway_schema_history

server:
  port: ${APP_PORT:8080}

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:public_key.pem}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
